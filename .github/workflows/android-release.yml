name: Android Release

on:
  push:
    tags: ['v*']
  # Select an existing vX.Y.Z tag when dispatching, not a branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release version
        id: version
        env:
          TAG: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'Release tags must be vMAJOR.MINOR.PATCH (e.g. v1.1.0)' >&2
            exit 1
          }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=$((1000 + RUN_NUMBER))" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: true
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Test and build release (no signing credentials)
        working-directory: ProtonSyncApp
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          ./gradlew --no-daemon --max-workers=2 testDebugUnitTest assembleRelease \
            "-PreleaseVersionName=$VERSION" "-PreleaseVersionCode=$VERSION_CODE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-unsigned
          path: ProtonSyncApp/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-test-reports
          path: |
            ProtonSyncApp/app/build/reports/tests/
            ProtonSyncApp/app/build/test-results/
          retention-days: 7

  sign:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Configure required reviewers and allowed release tags in repository settings.
    environment: release
    steps:
      # No source checkout or Gradle execution in the secret-bearing job.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install signing tools
        run: sdkmanager 'build-tools;35.0.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-unsigned
          path: input
      - name: Align, sign and verify
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          VERSION: ${{ needs.build.outputs.version }}
          VERSION_CODE: ${{ needs.build.outputs.code }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}"
          : "${STORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${EXPECTED_CERT:?Missing ANDROID_SIGNING_CERT_SHA256 variable}"
          export KEY_PASSWORD="${KEY_PASSWORD:-$STORE_PASSWORD}"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          umask 077
          private_dir="$(mktemp -d "$RUNNER_TEMP/protonsync-signing.XXXXXX")"
          trap 'rm -rf "$private_dir"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$private_dir/release.p12"
          mkdir -p signed
          apk="signed/ProtonSync-${VERSION}.apk"
          "$tools/zipalign" -P 16 -f 4 input/app-release-unsigned.apk "$private_dir/aligned.apk"
          "$tools/apksigner" sign \
            --ks "$private_dir/release.p12" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --v4-signing-enabled false --out "$apk" "$private_dir/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > signed/signing-certificate.txt
          "$tools/zipalign" -c -P 16 4 "$apk"
          expected="$(printf '%s' "$EXPECTED_CERT" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          actual="$(awk '/^Signer #1 certificate SHA-256 digest:/ {print $NF}' signed/signing-certificate.txt)"
          [[ "$actual" == "$expected" ]] || { echo 'Signing certificate mismatch' >&2; exit 1; }
          "$tools/aapt" dump badging "$apk" > "$private_dir/badging.txt"
          if grep -q 'application-debuggable' "$private_dir/badging.txt"; then
            echo 'Refusing to release a debuggable APK' >&2
            exit 1
          fi
          "$tools/aapt" dump xmltree "$apk" AndroidManifest.xml > "$private_dir/manifest.txt"
          grep -Eq 'android:allowBackup.*0x0$' "$private_dir/manifest.txt"
          printf 'Source commit: %s\nVersion: %s\nVersion code: %s\nWorkflow run: %s/%s/actions/runs/%s\n' \
            "$SOURCE_COMMIT" "$VERSION" "$VERSION_CODE" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            > signed/build-info.txt
          (cd signed && sha256sum "ProtonSync-${VERSION}.apk" > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-signed
          path: signed/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-signed
          path: signed
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd signed && sha256sum --check SHA256SUMS)
          # Fail rather than silently replacing assets of an existing release.
          gh release create "$TAG" signed/*.apk signed/SHA256SUMS \
            signed/signing-certificate.txt signed/build-info.txt \
            --verify-tag --title "ProtonSync $TAG" --generate-notes
